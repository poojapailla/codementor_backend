# Local test configuration for a developer machine.
# Database credentials come from the same environment variables the app uses
# (DB_USERNAME / DB_PASSWORD / JWT_SECRET), so no secret ever lives in source.
spring.datasource.url=jdbc:mysql://localhost:3306/codementor_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET:unit-test-secret-that-is-long-enough-for-hs256-1234567890}
app.jwt.expiration-minutes=1440
ai.service.url=http://127.0.0.1:8000
cors.allowed-origins=http://localhost:5173