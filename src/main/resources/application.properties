spring.application.name=codementor-backend

spring.datasource.url=jdbc:mysql://localhost:3306/codementor_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# JWT authentication. Provide a unique secret of at least 32 bytes via environment.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Comma-separated list of frontend origins allowed by CORS.
cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174}

ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

logging.level.org.springframework.security=INFO