spring.application.name=codementor-backend

# ===============================
# Aiven MySQL Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://codementor-mysql-codementorai.a.aivencloud.com:17960/defaultdb?sslMode=REQUIRED&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

# ===============================
# JWT Authentication
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ===============================
# Frontend CORS
# ===============================
cors.allowed-origins=${FRONTEND_ORIGINS:https://codementor-trifle-e629ce.netlify.app}

# ===============================
# Python AI Service
# ===============================
ai.service.url=${AI_SERVICE_URL:https://codementor-ai-service-d8mk.onrender.com}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO